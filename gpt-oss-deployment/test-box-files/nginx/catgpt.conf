# cat-GPT gateway front end (test box). Settings from flask-gateway-and-security.md §4-§6.
limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;

upstream catgpt_gateway {
    server 127.0.0.1:8080;          # gunicorn + Flask gateway
    keepalive 16;
}

server {
    listen 443 ssl;
    server_name testbox;
    ssl_certificate     /etc/nginx/tls/testbox.crt;
    ssl_certificate_key /etc/nginx/tls/testbox.key;

    client_max_body_size 1m;
    limit_req zone=perip burst=20 nodelay;

    # Only the allowlisted OpenAI routes reach the gateway; everything else (/metrics, /tokenize, ...) is 404.
    location ~ ^/v1/(chat/completions|models)$ {
        proxy_pass http://catgpt_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;            # SSE: pass tokens through immediately
        proxy_read_timeout 300s;        # gaps between reads (queue/prefill); vLLM also sends keep-alives every 15 s
    }

    location / { return 404; }
}
